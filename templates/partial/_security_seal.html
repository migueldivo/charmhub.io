{% macro security_seal(in_progress=False, label="Secure") %}
<span class="p-security-seal{% if in_progress %} is-in-progress{% endif %}"
      title="{% if in_progress %}Security approval in progress{% else %}Security seal of approval{% endif %}">
  <svg class="p-security-seal__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path d="M12 1.5l2.2 1.6 2.7-.3 1.1 2.5 2.5 1.1-.3 2.7 1.6 2.2-1.6 2.2.3 2.7-2.5 1.1-1.1 2.5-2.7-.3L12 22.5l-2.2-1.6-2.7.3-1.1-2.5-2.5-1.1.3-2.7L2.2 12l1.6-2.2-.3-2.7 2.5-1.1 1.1-2.5 2.7.3z" fill="currentColor"/>
    <path d="M7.5 12.2l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="p-security-seal__label">{{ label }}</span>
</span>
{% endmacro %}
